name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Public protocol and lifecycle fixtures
        run: node --test gateway/test/*.test.js editor/world/test/geodata.test.mjs editor/world/test/net-lifecycle.test.mjs tools/dev/db_cli.test.cjs
      - name: Appearance lifecycle and material fixtures
        run: node --test editor/world/test/appearance.test.mjs editor/world/test/entity-admission.test.mjs editor/world/test/online-session.test.mjs editor/world/test/scene-loading.test.mjs editor/world/test/hairmaterials.test.mjs editor/world/test/hair-inspection.test.mjs editor/charcreate/test/appearance.test.mjs
      - name: Portable original hair decoder fixtures
        run: |
          python3 -m unittest discover -s tools/dat -p test_build_hair.py
          python3 -m unittest discover -s tools/ui -p test_hair_selection_native.py
          python3 -m unittest discover -s tools/ui -p test_creation_appearance_native.py
          python3 -m unittest discover -s tools/ui -p test_hair_attachment_native.py
          python3 -m unittest discover -s tools/src/char_pipeline -p test_default_hair_bindings.py
      - name: Synthetic PE and native method comparison fixtures
        run: |
          python3 -m pip install capstone==5.0.7
          python3 -m unittest discover -s tools/ui -p test_supplemental_pe.py
          python3 -m unittest discover -s tools/ui -p test_grounding_native.py
      - name: Original BSP source and extent sweep fixtures
        run: |
          python3 -m unittest discover -s tools/world -p test_bsp_collision.py
          python3 -m unittest discover -s tools/ui -p test_bsp_camera_native.py
          node --test editor/world/test/bsp-collision.test.mjs
      - name: Original terrain, cylinder and level collision fixtures
        run: |
          node --test editor/world/test/terrain-collision.test.mjs editor/world/test/cylinder-collision.test.mjs editor/world/test/level-collision.test.mjs
          python3 -m unittest discover -s tools/ui -p test_cylinder_collision_native.py
          python3 -m unittest discover -s tools/world -p test_export_terrain_collision.py
      - name: Original animation keys and interpolation fixtures
        run: |
          python3 -m unittest discover -s tools/anim -p test_pawnanim_source.py
          python3 -m unittest discover -s tools/anim -p test_export_source_tracks.py
          python3 -m unittest discover -s tools/anim -p test_build_npc_variants.py
          python3 -m unittest discover -s tools/ui -p test_npc_animation_native.py
          python3 -m unittest discover -s tools/ui -p test_quaternion_native.py
          python3 -m unittest discover -s tools/ui -p test_animation_linkup_native.py
          python3 -m unittest discover -s tools/ui -p test_pose_coordinates_native.py
          python3 -m unittest discover -s tools/ui -p test_pose_tween_native.py
          python3 -m unittest discover -s tools/ui -p test_pose_cache_native.py
          python3 -m unittest discover -s tools/ui -p test_animation_fpu_native.py
          python3 -m unittest discover -s tools/ui -p test_cast_sound_native.py
          node --test editor/world/test/nativequaternion.test.mjs editor/world/test/nativecoords.test.mjs editor/world/test/nativetrack.test.mjs editor/world/test/sourcepose.test.mjs editor/world/test/pawn-source-inspection.test.mjs editor/world/test/pawn-appearance-inspection.test.mjs editor/world/test/sourceanim-data.test.mjs editor/world/test/sourcepose-playback.test.mjs editor/world/test/nativetween.test.mjs editor/world/test/castplayback.test.mjs editor/world/test/castplayback-review.test.mjs editor/world/test/waitanim.test.mjs editor/world/test/native-castschedule.test.mjs editor/world/test/player-transform.test.mjs
          node --test editor/world/test/native-random.test.mjs editor/world/test/npcwaitanim.test.mjs editor/world/test/npcsourceanim.test.mjs editor/world/test/npc-source-skin.test.mjs editor/world/test/npc-source-inspection.test.mjs editor/world/test/npc-entity-lifecycle.test.mjs editor/world/test/npcanimations.test.mjs
          node --test editor/world/test/animnotify-clock.test.mjs editor/world/test/audio-lifecycle.test.mjs editor/world/test/combat-approach.test.mjs editor/world/test/skill-state.test.mjs editor/world/test/camera-inspection.test.mjs
      - name: Java configuration round trip
        run: node --test deploy/test/password-config.test.cjs
      - name: Standalone toolkit packaging tests
        run: |
          python3 -m unittest discover -s tools/release -p test_build_core.py
          python3 -m unittest discover -s tools/release -p test_build_npc_source.py
          python3 -m unittest discover -s tools/release -p test_build_bsp.py
      - name: Build and verify the isolated source-only toolkit
        run: python3 tools/release/build_core.py --check
      - name: Build and verify the isolated NPC source toolkit
        run: python3 tools/release/build_npc_source.py --check --native-fixtures
      - name: Build and verify the isolated BSP Inspector toolkit
        run: python3 tools/release/build_bsp.py --check
